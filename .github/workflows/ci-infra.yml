# ═══════════════════════════════════════════════════
# CI — Infrastructure as Code (Terraform)
# Trigger: Push/PR vào infrastructure/**
# Stages: Format Check → Validate → Security Scan
# ═══════════════════════════════════════════════════

name: CI — Infrastructure (Terraform)

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/ci-infra.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'infrastructure/**'

env:
  TERRAFORM_VERSION: '1.9.8'

jobs:
  # ── Stage 1: Kiểm tra định dạng và cú pháp ─────────
  validate:
    name: "Stage 1 — Format & Validate (${{ matrix.environment }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # Kiểm tra định dạng trên toàn bộ cây thư mục hạ tầng, bao gồm cả modules
      - name: "Terraform Format Check"
        run: terraform fmt -check -recursive infrastructure/

      # `-backend=false` cho phép khởi tạo mà không cần kết nối tới S3 backend
      # và không cần thông tin đăng nhập AWS, phù hợp với môi trường CI.
      - name: "Terraform Init (không dùng backend từ xa)"
        working-directory: infrastructure/environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: "Terraform Validate"
        working-directory: infrastructure/environments/${{ matrix.environment }}
        run: terraform validate

  # ── Stage 2: Quét bảo mật cấu hình hạ tầng ─────────
  security:
    name: "Stage 2 — Quét bảo mật cấu hình Terraform"
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Báo cáo mọi cấu hình sai lệch để nhóm nắm hiện trạng
      - name: "Trivy IaC — Báo cáo (CRITICAL + HIGH)"
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'infrastructure/'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'table'

      # Quality Gate: chặn khi có cấu hình sai lệch ở mức nghiêm trọng,
      # ví dụ S3 bucket để công khai hoặc Security Group mở toàn bộ cổng ra Internet.
      - name: "Trivy IaC — Quality Gate (chặn khi có CRITICAL)"
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'infrastructure/'
          severity: 'CRITICAL'
          exit-code: '1'
          format: 'table'
