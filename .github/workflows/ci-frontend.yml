# ═══════════════════════════════════════════════════
# CI — Frontend (React + Vite SPA)
# Trigger: Push/PR vào frontend/**
# Stages: Code Quality → Security → Deploy to S3 (only on main/master)
# ═══════════════════════════════════════════════════

name: CI — Frontend

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'frontend/**'

env:
  NODE_VERSION: '24'
  S3_BUCKET: zelostech.site
  AWS_REGION: ap-southeast-1

jobs:
  # ── Stage 1: Code Quality ──────────────────────────
  code-quality:
    name: "Stage 1 — Code Quality"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (mode=production, catches build-time errors)
        run: npm run build

  # ── Stage 2: Security Scanning ─────────────────────
  security-scan:
    name: "Stage 2 — Security Scanning"
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for Gitleaks

      - name: Gitleaks — Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy — SCA Scan (frontend dependencies)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'frontend/'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'library'
          ignore-unfixed: true
          exit-code: '0'
          format: 'table'

  # ── Stage 3: Deploy to S3 Static Website Hosting ───
  deploy:
    name: "Stage 3 — Deploy to S3"
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (uses frontend/.env.production for VITE_API_URL)
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync dist/ to S3 (Static Website Hosting bucket)
        run: aws s3 sync dist/ "s3://${{ env.S3_BUCKET }}" --delete

      # Distribution nam o mot AWS account rieng (account A) khac voi account B
      # o tren (S3) — xem infrastructure/environments/dev/providers.tf. Khong
      # co buoc nay, CloudFront tiep tuc phat ban index.html/asset da cache tu
      # truoc, du S3 da co ban moi (da gap thuc te: title page cu bi cache
      # gan 9 tieng sau khi da deploy ban moi).
      - name: Configure AWS credentials (account A — CloudFront)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_ACCOUNT_A }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_ACCOUNT_A }}
          aws-region: us-east-1

      - name: Invalidate frontend CloudFront cache
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items, 'zelostech.site')].Id" \
            --output text)

          if [ -n "$DISTRIBUTION_ID" ] && [ "$DISTRIBUTION_ID" != "None" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths "/*"
            echo "✅ Frontend CloudFront cache invalidated for distribution: $DISTRIBUTION_ID"
          else
            echo "⚠️ No frontend CloudFront distribution found (aliases zelostech.site), skipping invalidation"
          fi

      - name: Deploy Summary
        run: |
          echo "## 🚀 Frontend Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **Bucket:** s3://${{ env.S3_BUCKET }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** http://${{ env.S3_BUCKET }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
