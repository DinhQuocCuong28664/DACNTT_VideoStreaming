# ═══════════════════════════════════════════════════
# CI — Transcoder (Docker Build + ECR Push)
# Trigger: Push/PR vào transcoder/**
# Stages: Code Quality → Security → Build & Scan Image → Deploy
# ═══════════════════════════════════════════════════

name: CI — Transcoder

on:
  push:
    branches: [main, develop]
    paths:
      - 'transcoder/**'
      - '.github/workflows/ci-transcoder.yml'
  pull_request:
    branches: [main]
    paths:
      - 'transcoder/**'

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: dacntt-transcoder

jobs:
  # ── Stage 1: Code Quality ──────────────────────────
  code-quality:
    name: "Stage 1 — Code Quality"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transcoder

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: transcoder/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npx eslint src/ --max-warnings 0

  # ── Stage 2: Security Scanning ─────────────────────
  security-scan:
    name: "Stage 2 — Security Scanning"
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Stage 3: Build Docker Image & Scan ─────────────
  build-scan:
    name: "Stage 3 — Build & Scan Image"
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: transcoder
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
            .

      - name: Trivy — Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table'

      - name: Push image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  # ── Stage 4: Update Batch Job Definition ───────────
  deploy:
    name: "Stage 4 — Deploy (Update Batch Job Def)"
    runs-on: ubuntu-latest
    needs: build-scan
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update Batch Job Definition
        run: |
          NEW_IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          
          # Get current job definition
          CURRENT_JOB_DEF=$(aws batch describe-job-definitions \
            --job-definition-name dacntt-dev-transcoder-job \
            --status ACTIVE \
            --query 'jobDefinitions[0]' \
            --output json)
          
          # Update container image in job definition
          echo "$CURRENT_JOB_DEF" | \
            jq --arg img "$NEW_IMAGE" '.containerProperties.image = $img' | \
            jq '{jobDefinitionName: .jobDefinitionName, type: .type, containerProperties: .containerProperties, platformCapabilities: .platformCapabilities}' | \
            xargs -0 aws batch register-job-definition --cli-input-json
          
          echo "✅ Batch Job Definition updated with image: $NEW_IMAGE"
