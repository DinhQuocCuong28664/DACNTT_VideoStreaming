# ═══════════════════════════════════════════════════
# CI — Transcoder (Docker Build + ECR Push)
# Trigger: Push/PR vào transcoder/**
# Stages: Code Quality → Security → Build & Scan Image → Deploy
# ═══════════════════════════════════════════════════

name: CI — Transcoder

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    paths:
      - 'transcoder/**'
      - '.github/workflows/ci-transcoder.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'transcoder/**'

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: dacntt-transcoder

jobs:
  # ── Stage 1: Code Quality ──────────────────────────
  code-quality:
    name: "Stage 1 — Code Quality"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transcoder

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: transcoder/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npx eslint src/ --max-warnings 0

  # ── Stage 2: Security Scanning ─────────────────────
  security-scan:
    name: "Stage 2 — Security Scanning"
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Stage 3: Build Docker Image & Scan ─────────────
  build-scan:
    name: "Stage 3 — Build & Scan Image"
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: transcoder
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
            .

      - name: Trivy — Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          trivy-options: '--pkg-types library --ignore-unfixed'
          exit-code: '0'
          format: 'table'

      - name: Ensure ECR Repository Exists
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }} || \
          aws ecr create-repository \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true

      - name: Push image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  # ── Stage 4: Update Batch Job Definition ───────────
  deploy:
    name: "Stage 4 — Deploy (Update Batch Job Def)"
    runs-on: ubuntu-latest
    needs: build-scan
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update Batch Job Definition
        run: |
          NEW_IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          
          # Check if job definition exists on AWS
          CURRENT_JOB_DEF=$(aws batch describe-job-definitions \
            --job-definition-name dacntt-dev-transcoder-job \
            --status ACTIVE \
            --query 'jobDefinitions[0]' \
            --output json 2>/dev/null || echo "null")
          
          if [ "$CURRENT_JOB_DEF" != "null" ] && [ "$CURRENT_JOB_DEF" != "" ] && [ "$CURRENT_JOB_DEF" != "None" ]; then
            UPDATED_JSON=$(echo "$CURRENT_JOB_DEF" | \
              jq --arg img "$NEW_IMAGE" '.containerProperties.image = $img' | \
              jq '{jobDefinitionName: .jobDefinitionName, type: .type, containerProperties: .containerProperties, platformCapabilities: .platformCapabilities}')
            
            aws batch register-job-definition --cli-input-json "$UPDATED_JSON"
            echo "✅ AWS Batch Job Definition updated with new image: $NEW_IMAGE"
          else
            echo "⚠️ AWS Batch Job Definition 'dacntt-dev-transcoder-job' is not yet created on AWS."
            echo "✅ Docker Image '$NEW_IMAGE' was built & pushed to Amazon ECR successfully!"
            echo "ℹ️ Run 'terraform apply' inside infrastructure/environments/dev to provision AWS Batch."
          fi
