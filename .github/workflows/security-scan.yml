# ═══════════════════════════════════════════════════
# Security Scan — DevSecOps Gate (Every Pull Request)
# ═══════════════════════════════════════════════════

name: Security Scan — DevSecOps Gate

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  gitleaks:
    name: "Gitleaks — Secret Detection"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-sca:
    name: "Trivy — Dependency Scan"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        directory: [backend, transcoder]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy SCA Scan (${{ matrix.directory }})
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ matrix.directory }}/'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1' # Block PR if Critical/High found
          format: 'table'

