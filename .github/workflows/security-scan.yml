# ═══════════════════════════════════════════════════
# Security Scan — DevSecOps Gate (Every Pull Request)
# ═══════════════════════════════════════════════════

name: Security Scan — DevSecOps Gate

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  gitleaks:
    name: "Gitleaks — Secret Detection"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-sca:
    name: "Trivy — Dependency Scan"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        directory: [backend, transcoder]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước cảnh báo: liệt kê toàn bộ lỗ hổng CRITICAL và HIGH để nhóm nắm được
      # hiện trạng, nhưng không chặn pipeline vì nhiều lỗ hổng HIGH nằm ở
      # dependency gián tiếp và chưa có bản vá.
      - name: "Trivy SCA — Báo cáo (CRITICAL + HIGH)"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ matrix.directory }}/'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'library'
          ignore-unfixed: true
          exit-code: '0'
          format: 'table'

      # Quality Gate thực sự: chỉ lỗ hổng CRITICAL đã có bản vá mới chặn pipeline.
      # Đây là bước khiến Pull Request bị đánh dấu thất bại và không thể merge.
      - name: "Trivy SCA — Quality Gate (chặn khi có CRITICAL)"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ matrix.directory }}/'
          severity: 'CRITICAL'
          vuln-type: 'library'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'

  # ── SAST: Phân tích tĩnh mã nguồn tìm mẫu code dễ sinh lỗ hổng ──
  # Sử dụng eslint-plugin-security thay vì SonarQube: không cần dựng và duy trì
  # một SonarQube Server riêng, đồng thời vẫn chạy thực sự trong pipeline và
  # chặn được pipeline khi phát hiện lỗi ở mức `error`.
  sast:
    name: "SAST — Phân tích tĩnh bảo mật mã nguồn"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Cờ --max-warnings=0 khiến mọi cảnh báo bảo mật chưa được xem xét đều
      # làm pipeline thất bại, buộc nhóm phải xử lý hoặc giải trình bằng chú
      # thích eslint-disable kèm lý do trước khi merge.
      - name: "Chạy phân tích bảo mật (eslint-plugin-security)"
        working-directory: backend
        run: npx eslint src/ tests/ --max-warnings=0
