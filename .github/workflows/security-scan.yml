# Security gate on every push and pull request. The job names are required status checks
# in the "Protect master" ruleset, so they must not change.

name: Security Scan — DevSecOps Gate

on:
  workflow_dispatch:
  push:
    branches: [master, rebuild/v2]
  pull_request:
    branches: [master, rebuild/v2]

permissions:
  contents: read

jobs:
  gitleaks:
    name: "Gitleaks — Secret Detection"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the full history

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-sca:
    # The labels keep the check names the ruleset requires. "backend" scans the npm
    # lockfile of the whole monorepo; "transcoder" scans the container image sources.
    name: "Trivy — Dependency Scan (${{ matrix.label }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - label: backend
            path: .
          - label: transcoder
            path: transcoder
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Skip when the path does not exist yet
        id: present
        run: |
          if [ -e "${{ matrix.path }}" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      # Report every CRITICAL and HIGH finding without failing the build.
      - name: "Trivy SCA — report (CRITICAL + HIGH)"
        if: steps.present.outputs.run == 'true'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '${{ matrix.path }}'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'library'
          ignore-unfixed: true
          exit-code: '0'
          format: 'table'

      # Quality gate: a fixable CRITICAL vulnerability fails the check.
      - name: "Trivy SCA — gate (fail on CRITICAL)"
        if: steps.present.outputs.run == 'true'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '${{ matrix.path }}'
          severity: 'CRITICAL'
          vuln-type: 'library'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'

  sast:
    # eslint-plugin-security runs over every workspace; any warning fails the check
    # until it is fixed or justified with an inline comment.
    name: "SAST — Phân tích tĩnh bảo mật mã nguồn"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static security analysis (eslint-plugin-security)
        run: npm run lint
