# ═══════════════════════════════════════════════════
# CD — Continuous Deployment (Merge to main)
# Stages: detect changed paths → invalidate video CDN cache
#         (always) → deploy backend to EC2 (only if backend/**
#         changed)
# ═══════════════════════════════════════════════════

name: CD — Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  AWS_REGION: ap-southeast-1

jobs:
  # ── Detect which paths changed (monorepo — skip backend
  # deploy on frontend-only or infra-only pushes) ──────
  detect-changes:
    name: "Detect Changed Paths"
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'

  invalidate-cdn:
    name: "Invalidate Video CDN Cache"
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Invalidate CloudFront Cache
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='dacntt-prod HLS Video CDN'].Id" \
            --output text)

          if [ -n "$DISTRIBUTION_ID" ] && [ "$DISTRIBUTION_ID" != "None" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths "/*"
            echo "✅ CloudFront cache invalidated for distribution: $DISTRIBUTION_ID"
          else
            echo "⚠️ No CloudFront distribution found, skipping invalidation"
          fi

      - name: Deploy Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront:** Cache invalidated" >> $GITHUB_STEP_SUMMARY

  # ── Deploy Backend to EC2 (only when backend/** changed) ──
  deploy-backend:
    name: "Deploy Backend to EC2"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    environment: production

    steps:
      - name: Deploy over SSH (git pull + npm install + pm2 restart)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/app
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            cd backend
            npm install --production
            pm2 restart backend-api || pm2 start src/server.js --name backend-api
            pm2 save

      - name: Deploy Summary
        run: |
          echo "## 🚀 Backend Deployed to EC2" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
