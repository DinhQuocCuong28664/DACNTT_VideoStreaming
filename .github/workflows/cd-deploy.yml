# ═══════════════════════════════════════════════════
# CD — Continuous Deployment (Merge to main)
# ═══════════════════════════════════════════════════

name: CD — Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  AWS_REGION: ap-southeast-1

jobs:
  deploy:
    name: "Deploy to Production"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Invalidate CloudFront Cache
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='dacntt-prod HLS Video CDN'].Id" \
            --output text)
          
          if [ -n "$DISTRIBUTION_ID" ] && [ "$DISTRIBUTION_ID" != "None" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths "/*"
            echo "✅ CloudFront cache invalidated for distribution: $DISTRIBUTION_ID"
          else
            echo "⚠️ No CloudFront distribution found, skipping invalidation"
          fi

      - name: Deploy Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront:** Cache invalidated" >> $GITHUB_STEP_SUMMARY
