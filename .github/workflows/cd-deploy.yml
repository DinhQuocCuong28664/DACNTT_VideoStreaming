# ═══════════════════════════════════════════════════
# CD — Continuous Deployment (Merge to main)
# Stages: CI — Backend passes → deploy that exact commit to AWS Lambda Multi-AZ
# ═══════════════════════════════════════════════════

name: CD — Deploy

# Chỉ deploy commit đã qua CI Backend thành công.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI — Backend"]
    types: [completed]
    branches: [main, master]

env:
  AWS_REGION: ap-southeast-1
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # ── Deploy Backend to AWS Lambda Multi-AZ (Serverless) ──
  deploy-backend:
    name: "Deploy Backend to AWS Lambda"
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Build and Package Lambda Artifact
        run: |
          set -e
          cd backend
          npm ci --omit=dev
          zip -q -r ../backend_api.zip src package.json package-lock.json node_modules
          cd ..
          ls -lh backend_api.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to AWS Lambda Function
        run: |
          set -e
          echo "Updating Lambda function: dacntt-dev-backend-api..."
          aws lambda update-function-code \
            --function-name dacntt-dev-backend-api \
            --zip-file fileb://backend_api.zip

          echo "Waiting for Lambda function update to complete..."
          aws lambda wait function-updated \
            --function-name dacntt-dev-backend-api

          echo "✅ Lambda function code updated successfully."

      - name: Verify Lambda API responds
        env:
          LAMBDA_HEALTH_URL: https://b7ssxm6vbhvfdcaxsdn7vmosgy0thkbw.lambda-url.ap-southeast-1.on.aws/health
        run: |
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$LAMBDA_HEALTH_URL" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "Lambda Backend API phan hoi OK (HTTP $CODE)"
              exit 0
            fi
            echo "Cho Lambda API san sang... (HTTP $CODE)"
            sleep 3
          done

          echo "::error::Lambda Backend API khong phan hoi HTTP 200"
          exit 1

      - name: Deploy Summary
        run: |
          echo "## 🚀 Backend Deployed to AWS Lambda Multi-AZ" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture:** Serverless Containerless (Node.js 22, Multi-AZ Active-Active)" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.event.workflow_run.head_branch || github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ env.DEPLOY_SHA }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Function URL:** https://b7ssxm6vbhvfdcaxsdn7vmosgy0thkbw.lambda-url.ap-southeast-1.on.aws/" >> $GITHUB_STEP_SUMMARY
