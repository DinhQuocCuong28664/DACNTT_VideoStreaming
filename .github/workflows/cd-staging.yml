# ═══════════════════════════════════════════════════
# CD — Staging Deployment (Triggered on develop branch)
# ═══════════════════════════════════════════════════

name: CD — Deploy to Staging (Dev)

on:
  workflow_dispatch:
  push:
    branches: [develop]

env:
  AWS_REGION: ap-southeast-1

jobs:
  deploy-staging:
    name: "Deploy to Staging (Dev Environment)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Khong cap credential AWS: `terraform init -backend=false` va `validate`
      # khong goi AWS (ci-infra.yml cung validate ma khong can khoa), nen dua
      # khoa vao job nay chi mo rong pham vi lo khoa ma khong dung vao dau.

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Validate & Plan Staging Infrastructure
        run: |
          cd infrastructure/environments/dev
          terraform init -backend=false
          terraform validate
          echo "✅ Staging environment validated successfully"
