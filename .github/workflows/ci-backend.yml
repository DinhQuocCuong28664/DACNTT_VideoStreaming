# ═══════════════════════════════════════════════════
# CI — Backend (Node.js API)
# Trigger: Push/PR vào backend/**
# Stages: Code Quality → Security Scanning
# ═══════════════════════════════════════════════════

name: CI — Backend

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'

env:
  NODE_VERSION: '18'

jobs:
  # ── Stage 1: Code Quality ──────────────────────────
  code-quality:
    name: "Stage 1 — Code Quality & Testing"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Run ESLint
        run: npx eslint src/ --max-warnings 0

      - name: npm audit (dependency vulnerabilities)
        run: npm audit --audit-level=critical

  # ── Stage 2: Security Scanning ─────────────────────
  security-scan:
    name: "Stage 2 — Security Scanning"
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for Gitleaks

      - name: Gitleaks — Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy — SCA Scan (backend dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'backend/'
          severity: 'CRITICAL,HIGH'
          trivy-options: '--pkg-types library --ignore-unfixed'
          exit-code: '0'
          format: 'table'
