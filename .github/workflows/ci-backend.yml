# ═══════════════════════════════════════════════════
# CI — Backend (Node.js API)
# Trigger: Push/PR vào backend/**
# Stages: Code Quality → Security Scanning
# ═══════════════════════════════════════════════════

name: CI — Backend

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'

env:
  NODE_VERSION: '24'

jobs:
  # ── Stage 1: Code Quality ──────────────────────────
  code-quality:
    name: "Stage 1 — Code Quality & Testing"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Run ESLint
        run: npx eslint src/ --max-warnings 0

      - name: npm audit (dependency vulnerabilities)
        run: npm audit --audit-level=critical

  # ── Stage 2: Security Scanning ─────────────────────
  security-scan:
    name: "Stage 2 — Security Scanning"
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for Gitleaks

      - name: Gitleaks — Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Ghim theo SHA thay vi @master. Truoc day ca nam workflow deu tro vao
      # nhanh master cua action nay, nghia la bat ky thay doi nao o repo do —
      # ke ca do bi chiem quyen — se chay ngay trong CI cua du an, noi co san
      # thong tin dang nhap AWS. Trớ trêu la chinh action quet bao mat lai la
      # thanh phan duoc ghim long leo nhat trong toan bo pipeline.
      - name: Trivy — SCA Scan (backend dependencies)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'backend/'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'library'
          ignore-unfixed: true
          exit-code: '0'
          format: 'table'
