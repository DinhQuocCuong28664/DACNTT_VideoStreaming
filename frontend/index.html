<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VidShare</title>
    <!--
      Thẻ mô tả cho công cụ tìm kiếm và thẻ Open Graph cho lúc dán liên kết
      vào tin nhắn hay mạng xã hội. Thiếu chúng thì liên kết hiện ra chỉ là
      một dòng địa chỉ trơ. Ảnh xem trước dùng chính ảnh chụp trang danh mục
      đã có trong thư mục public, địa chỉ phải tuyệt đối mới đọc được.
    -->
    <meta
      name="description"
      content="VidShare tự động chuyển mã video sang HLS 360p, 720p và 1080p trên hạ tầng AWS, rồi phát qua CloudFront."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VidShare" />
    <meta property="og:title" content="VidShare" />
    <meta
      property="og:description"
      content="Nền tảng chia sẻ video với chuyển mã HLS tự động trên AWS."
    />
    <meta property="og:url" content="https://zelostech.site/" />
    <meta property="og:image" content="https://zelostech.site/preview-catalogue.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Một họ chữ Roboto cho toàn bộ giao diện (có bộ ký tự tiếng Việt), đúng
      tinh thần giao diện kiểu YouTube. Nạp bằng thẻ link thay vì @import trong
      CSS: @import chỉ bắt đầu tải sau khi chính tệp CSS đã tải xong.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    />
    <!--
      Google Identity Services dựng chữ bên trong nút đăng nhập, và nó chốt
      ngôn ngữ ngay lúc script được nạp chứ không đọc lại tuỳ chọn `locale`
      truyền cho renderButton sau đó. Vì vậy ngôn ngữ phải đi kèm ngay trên URL
      của script. Đọc lựa chọn đã lưu của người dùng (cùng khoá mà bộ dò ngôn
      ngữ của i18next ghi) trước khi chèn thẻ script; nếu chưa có lựa chọn nào
      thì bỏ trống để Google tự suy từ trình duyệt như trước.
    -->
    <script>
      (function () {
        var lang = null;
        try {
          lang = localStorage.getItem('vidshare-language');
        } catch (e) {
          lang = null;
        }

        var src = 'https://accounts.google.com/gsi/client';
        if (lang === 'vi' || lang === 'en') src += '?hl=' + lang;

        var s = document.createElement('script');
        s.src = src;
        s.async = true;
        s.defer = true;
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
