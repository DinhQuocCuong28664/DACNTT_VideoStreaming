<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VidShare</title>
    <!--
      Thẻ mô tả cho công cụ tìm kiếm và thẻ Open Graph cho lúc dán liên kết
      vào tin nhắn hay mạng xã hội. Thiếu chúng thì liên kết hiện ra chỉ là
      một dòng địa chỉ trơ. Ảnh xem trước dùng chính ảnh chụp trang danh mục
      đã có trong thư mục public, địa chỉ phải tuyệt đối mới đọc được.
    -->
    <meta
      name="description"
      content="VidShare tự động chuyển mã video sang HLS 360p, 720p và 1080p trên hạ tầng AWS, rồi phát qua CloudFront."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VidShare" />
    <meta property="og:title" content="VidShare" />
    <meta
      property="og:description"
      content="Nền tảng chia sẻ video với chuyển mã HLS tự động trên AWS."
    />
    <meta property="og:url" content="https://zelostech.site/" />
    <meta property="og:image" content="https://zelostech.site/preview-catalogue.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Một họ chữ Roboto cho toàn bộ giao diện (có bộ ký tự tiếng Việt), đúng
      tinh thần giao diện kiểu YouTube. Nạp bằng thẻ link thay vì @import trong
      CSS: @import chỉ bắt đầu tải sau khi chính tệp CSS đã tải xong.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    />
    <!--
      Google Identity Services, nạp kèm ngôn ngữ người dùng đã chọn — xem
      public/gsi-loader.js. Tệp riêng chứ không inline để Content-Security-Policy
      không cần 'unsafe-inline'.
    -->
    <script src="/gsi-loader.js" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
