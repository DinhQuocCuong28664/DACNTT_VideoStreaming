<text x="40" y="1300.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#4b5563" text-anchor="start">Transcoding has no actor of its own: every upload includes it, and it starts when the file reaches</text><text x="40" y="1323.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#4b5563" text-anchor="start">storage. Subscribers are notified, and speech is captioned if the plan allows it, when the video</text><text x="40" y="1346.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#4b5563" text-anchor="start">becomes public, after transcoding or at the scheduled time. The creator is the registered user of Figure 3.1.</text>

