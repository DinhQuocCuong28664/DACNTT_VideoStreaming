<ellipse cx="860" cy="924.4" rx="115" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="860" y="920.3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Screen frames and</text><text x="860" y="941.5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">make previews</text>
<ellipse cx="490" cy="1058.8" rx="155" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="490" y="1054.7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Notify subscribers</text><text x="490" y="1075.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">of a new video</text>
<ellipse cx="860" cy="1058.8" rx="115" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="860" y="1054.7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Caption speech</text><text x="860" y="1075.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">automatically</text>
