<ellipse cx="490" cy="370" rx="155" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="490" y="365.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Read channel and</text><text x="490" y="387.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">video analytics</text>
