<ellipse cx="490" cy="622" rx="155" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="490" y="628.5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Delete a video</text>
