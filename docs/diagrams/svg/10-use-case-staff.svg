<text x="40" y="1024.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#5b6470" text-anchor="start">Reporting and appealing are open to every signed-in user. An administrator can also do everything</text><text x="40" y="1047.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#5b6470" text-anchor="start">an operator or an auditor can, so each association is drawn once, at the role that owns the use case.</text><text x="40" y="1070.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#5b6470" text-anchor="start">Screening acts on its own; what it holds back, and what viewers report, reaches an operator for a decision.</text>
