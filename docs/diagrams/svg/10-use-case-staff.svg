<text x="40" y="1222.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#4b5563" text-anchor="start">Reporting and appealing are open to every signed-in user. An administrator is also an operator and an</text><text x="40" y="1245.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#4b5563" text-anchor="start">auditor (hollow arrows: generalisation). What screening holds back, what viewers report and what</text><text x="40" y="1268.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#4b5563" text-anchor="start">owners appeal reaches an operator's queue. Screening is included in transcoding (Figure 3.2).</text>

