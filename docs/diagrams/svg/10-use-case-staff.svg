<rect x="170" y="40" width="800" height="1136" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="570" y="70.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#111111" text-anchor="middle">Moderation and operation</text>
<ellipse cx="800" cy="190" rx="140" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="800" y="185.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Approve or remove a video,</text><text x="800" y="207.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">with a reason</text>
<ellipse cx="800" cy="282" rx="140" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="800" y="277.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Confirm a removal</text><text x="800" y="299.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">the machine made</text>
<ellipse cx="800" cy="374" rx="140" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="800" y="369.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Resolve an appeal</text><text x="800" y="391.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">with a note</text>
<ellipse cx="800" cy="466" rx="140" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="800" y="461.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Label a video of</text><text x="800" y="483.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">an audit sample</text>
<ellipse cx="800" cy="558" rx="140" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="800" y="553.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Dismiss or remove</text><text x="800" y="575.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">a reported comment</text>
<ellipse cx="800" cy="650" rx="140" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="800" y="645.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Read the error rates</text><text x="800" y="667.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">with their intervals</text>
<ellipse cx="800" cy="742" rx="140" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="800" y="748.5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Read the decision log</text>
<ellipse cx="800" cy="834" rx="140" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="800" y="829.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Draw a random</text><text x="800" y="851.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">audit sample</text>
<ellipse cx="800" cy="926" rx="140" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="800" y="921.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Assign or change</text><text x="800" y="943.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">a user's role</text>
<ellipse cx="800" cy="1018" rx="140" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="800" y="1013.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Read the system</text><text x="800" y="1035.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">overview</text>
<ellipse cx="800" cy="1110" rx="140" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="800" y="1105.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Switch screening or</text><text x="800" y="1127.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">automatic captions</text>
<ellipse cx="330" cy="112" rx="125" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="330" y="107.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Screen frames of</text><text x="330" y="129.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">an uploaded video</text>
<ellipse cx="330" cy="190" rx="125" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="330" y="196.5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Report a video</text>
<ellipse cx="330" cy="374" rx="125" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="330" y="369.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Appeal the removal or</text><text x="330" y="391.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">hold of one's own video</text>
<ellipse cx="330" cy="558" rx="125" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="330" y="564.5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Report a comment</text>
