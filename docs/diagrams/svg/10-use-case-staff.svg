<circle cx="1090" cy="349" r="13" fill="#ffffff" stroke="#222222" stroke-width="1.6"/><path d="M 1090 362 L 1090 396" stroke="#222222" stroke-width="1.6"/><path d="M 1070 374 L 1110 374" stroke="#222222" stroke-width="1.6"/><path d="M 1090 396 L 1074 422" stroke="#222222" stroke-width="1.6"/><path d="M 1090 396 L 1106 422" stroke="#222222" stroke-width="1.6"/><text x="1090" y="446.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Operator</text>
<circle cx="1090" cy="671" r="13" fill="#ffffff" stroke="#222222" stroke-width="1.6"/><path d="M 1090 684 L 1090 718" stroke="#222222" stroke-width="1.6"/><path d="M 1070 696 L 1110 696" stroke="#222222" stroke-width="1.6"/><path d="M 1090 718 L 1074 744" stroke="#222222" stroke-width="1.6"/><path d="M 1090 718 L 1106 744" stroke="#222222" stroke-width="1.6"/><text x="1090" y="768.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Auditor</text>
<circle cx="1090" cy="947" r="13" fill="#ffffff" stroke="#222222" stroke-width="1.6"/><path d="M 1090 960 L 1090 994" stroke="#222222" stroke-width="1.6"/><path d="M 1070 972 L 1110 972" stroke="#222222" stroke-width="1.6"/><path d="M 1090 994 L 1074 1020" stroke="#222222" stroke-width="1.6"/><path d="M 1090 994 L 1106 1020" stroke="#222222" stroke-width="1.6"/><text x="1090" y="1044.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Administrator</text>
