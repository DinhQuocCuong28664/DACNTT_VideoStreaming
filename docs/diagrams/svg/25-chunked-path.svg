    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
  </marker>
</defs>
<rect width="1500" height="1000" fill="#ffffff"/>

<rect x="40" y="40" width="1420" height="230" rx="12" fill="#f6fbf6" stroke="#3d8b40" stroke-width="1.5" stroke-dasharray="7 5"/><text x="56" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="bold" fill="#3d8b40" text-anchor="start">1. Plan (probe step): cut the source on GOP boundaries</text>
<rect x="70" y="96" width="124" height="46" rx="8" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.4"/><text x="132" y="123.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="middle">chunk 0</text>
<rect x="202" y="96" width="124" height="46" rx="8" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.4"/><text x="264" y="123.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="middle">chunk 1</text>
<rect x="334" y="96" width="124" height="46" rx="8" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.4"/><text x="396" y="123.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="middle">chunk 2</text>
<rect x="466" y="96" width="124" height="46" rx="8" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.4"/><text x="528" y="123.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="middle">chunk 3</text>
<rect x="598" y="96" width="124" height="46" rx="8" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.4"/><text x="660" y="123.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="middle">chunk 4</text>
<rect x="730" y="96" width="124" height="46" rx="8" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.4"/><text x="792" y="123.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="middle">chunk 5</text>
<rect x="862" y="96" width="124" height="46" rx="8" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.4"/><text x="924" y="123.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="middle">chunk 6</text>
<rect x="994" y="96" width="124" height="46" rx="8" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.4"/><text x="1056" y="123.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="middle">chunk 7</text>
<rect x="1126" y="96" width="124" height="46" rx="8" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.4"/><text x="1188" y="123.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="middle">chunk 8</text>
<rect x="1258" y="96" width="124" height="46" rx="8" fill="#f7f8fa" stroke="#98a2b3" stroke-width="1.4"/><text x="1320" y="123.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="middle">chunk 9</text>
<text x="70" y="178.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#1a1a1a" text-anchor="start">Each chunk is a whole number of 6-second GOPs (10 to 50 GOPs, about three chunks per slot); a</text><text x="70" y="200.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#1a1a1a" text-anchor="start">remainder under one GOP joins the previous chunk, and the last chunk is open-ended. Each window</text><text x="70" y="222.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#1a1a1a" text-anchor="start">starts half a frame early so the seek never lands on the previous frame; windows meet exactly.</text>
<rect x="40" y="310" width="1420" height="330" rx="12" fill="#fffaf3" stroke="#d98324" stroke-width="1.5" stroke-dasharray="7 5"/><text x="56" y="336.0" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="bold" fill="#d98324" text-anchor="start">2. Encode (Batch)</text>
<rect x="70" y="370" width="300" height="220" rx="10" fill="#fff4e6" stroke="#d98324" stroke-width="1.6"/><text x="220" y="408.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Audio job</text><text x="220" y="431.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#5b6470" text-anchor="middle">main queue, 1 vCPU</text><text x="220" y="450.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#5b6470" text-anchor="middle"></text><text x="220" y="469.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#5b6470" text-anchor="middle">AAC-LC once per</text><text x="220" y="488.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#5b6470" text-anchor="middle">bitrate of the plan</text><text x="220" y="507.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#5b6470" text-anchor="middle">(64k, 128k) for the</text><text x="220" y="526.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#5b6470" text-anchor="middle">whole source, before</text><text x="220" y="545.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#5b6470" text-anchor="middle">the chunks start</text>
<rect x="430" y="356" width="1000" height="256" rx="12" fill="#fffdf8" stroke="#d98324" stroke-width="1.5" stroke-dasharray="4 4"/><text x="446" y="382.0" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="bold" fill="#d98324" text-anchor="start">Chunk array job: N children, bulk queue, 4 vCPU each</text>
<rect x="456" y="400" width="146" height="92" rx="10" fill="#fff4e6" stroke="#d98324" stroke-width="1.6"/><text x="529" y="438.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">child 0</text><text x="529" y="461.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#5b6470" text-anchor="middle">all rungs</text>
<rect x="616" y="400" width="146" height="92" rx="10" fill="#fff4e6" stroke="#d98324" stroke-width="1.6"/><text x="689" y="438.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">child 1</text><text x="689" y="461.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#5b6470" text-anchor="middle">all rungs</text>
<rect x="776" y="400" width="146" height="92" rx="10" fill="#fff4e6" stroke="#d98324" stroke-width="1.6"/><text x="849" y="438.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">child 2</text><text x="849" y="461.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#5b6470" text-anchor="middle">all rungs</text>
<rect x="936" y="400" width="146" height="92" rx="10" fill="#fff4e6" stroke="#d98324" stroke-width="1.6"/><text x="1009" y="438.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">child 3</text><text x="1009" y="461.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#5b6470" text-anchor="middle">all rungs</text>
<rect x="1096" y="400" width="146" height="92" rx="10" fill="#fff4e6" stroke="#d98324" stroke-width="1.6"/><text x="1169" y="438.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">child 4</text><text x="1169" y="461.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#5b6470" text-anchor="middle">all rungs</text>
<rect x="1256" y="400" width="146" height="92" rx="10" fill="#fff4e6" stroke="#d98324" stroke-width="1.6"/><text x="1329" y="438.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">child 5</text><text x="1329" y="461.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#5b6470" text-anchor="middle">all rungs</text>
<text x="456" y="522.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#1a1a1a" text-anchor="start">Six Spot slots run at once, up to twelve with the On-Demand overflow; the rest wait in the queue.</text><text x="456" y="544.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#1a1a1a" text-anchor="start">A child trims its exact window, copies the matching audio, offsets timestamps onto one timeline</text><text x="456" y="566.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#1a1a1a" text-anchor="start">and writes c0007_000.ts … per rung.</text>
<text x="456" y="596.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#5b6470" text-anchor="start">A child that fails for good writes an abort marker; the others stop.</text>
<path d="M 370 446 L 456 446" fill="none" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40" y="700" width="1420" height="260" rx="12" fill="#f5fafc" stroke="#2c7a9e" stroke-width="1.5" stroke-dasharray="7 5"/><text x="56" y="726.0" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="bold" fill="#2c7a9e" text-anchor="start">3. Stitch (Lambda) and publish</text>
<rect x="70" y="750" width="420" height="180" rx="10" fill="#e8f4f8" stroke="#2c7a9e" stroke-width="1.6"/><text x="280" y="788.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Check every chunk</text><text x="280" y="811.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#5b6470" text-anchor="middle">a result for every chunk of the plan;</text><text x="280" y="830.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#5b6470" text-anchor="middle">all rungs cut at the same instants;</text><text x="280" y="849.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#5b6470" text-anchor="middle">drift under 3 frames from the plan,</text><text x="280" y="868.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#5b6470" text-anchor="middle">otherwise the video fails</text>
<rect x="560" y="750" width="420" height="180" rx="10" fill="#e8f4f8" stroke="#2c7a9e" stroke-width="1.6"/><text x="770" y="788.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Join the playlists</text><text x="770" y="811.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#5b6470" text-anchor="middle">one media playlist per rung from the</text><text x="770" y="830.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#5b6470" text-anchor="middle">chunk EXTINF lists, one EXT-X-KEY,</text><text x="770" y="849.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#5b6470" text-anchor="middle">measured BANDWIDTH,</text><text x="770" y="868.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#5b6470" text-anchor="middle">master playlist uploaded last</text>
