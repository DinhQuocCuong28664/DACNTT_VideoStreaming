<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
  </marker>
</defs>
<rect width="1320" height="720" fill="#ffffff"/>

<rect x="40" y="80" width="250" height="170" rx="10" fill="#f7f8fa" stroke="#98a2b3" stroke-width="1.6"/><text x="165" y="118.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Start</text><text x="165" y="141.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">master playlist loaded;</text><text x="165" y="163.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">no samples yet, so the</text><text x="165" y="185.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">estimate is 500 kbit/s</text><text x="165" y="207.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">(startLevel: auto)</text>
<rect x="340" y="40" width="640" height="560" rx="12" fill="#f6fbf6" stroke="#3d8b40" stroke-width="1.5" stroke-dasharray="7 5"/><text x="356" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="bold" fill="#3d8b40" text-anchor="start">Repeated for every segment</text>
<rect x="380" y="100" width="250" height="150" rx="10" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.6"/><text x="505" y="138.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Load segment</text><text x="505" y="161.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">from the chosen</text><text x="505" y="183.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">rendition, through</text><text x="505" y="205.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">the CDN</text>
<rect x="700" y="100" width="250" height="150" rx="10" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.6"/><text x="825" y="138.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Measure</text><text x="825" y="161.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">bytes over time of the</text><text x="825" y="183.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">download, folded into</text><text x="825" y="205.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">moving averages</text>
<rect x="700" y="390" width="250" height="170" rx="10" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.6"/><text x="825" y="428.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Estimate</text><text x="825" y="451.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">bandwidth estimate</text><text x="825" y="473.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">× 0.95 safety factor</text><text x="825" y="495.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">(abrBandWidthFactor)</text>
<rect x="380" y="390" width="250" height="170" rx="10" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.6"/><text x="505" y="428.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Choose a rung</text><text x="505" y="451.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">highest BANDWIDTH</text><text x="505" y="473.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">under the estimate;</text><text x="505" y="495.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">switch at the next</text><text x="505" y="517.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">segment boundary</text>
<rect x="1030" y="380" width="260" height="190" rx="10" fill="#f7f8fa" stroke="#98a2b3" stroke-width="1.6"/><text x="1160" y="418.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Limits</text><text x="1160" y="441.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">capLevelToPlayerSize:</text><text x="1160" y="463.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">no rung larger than</text><text x="1160" y="485.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">the video element;</text><text x="1160" y="507.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">a manual choice in the</text><text x="1160" y="529.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">menu turns ABR off</text>
<rect x="1030" y="100" width="260" height="170" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="1160" y="138.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Buffer running low</text><text x="1160" y="161.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">a slow download is</text><text x="1160" y="183.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">abandoned and a</text><text x="1160" y="205.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">lower rung is loaded</text><text x="1160" y="227.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="middle">at once</text>
<path d="M 290 175 L 380 175" fill="none" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 630 175 L 700 175" fill="none" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 825 250 L 825 390" fill="none" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 700 475 L 630 475" fill="none" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 505 390 L 505 250" fill="none" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 1030 475 L 950 475" fill="none" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<path d="M 1030 185 L 950 185" fill="none" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="40" y="650.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="start">The ladder makes this loop work: every rung starts each segment with a key frame at the same</text><text x="40" y="673.0" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="normal" fill="#5b6470" text-anchor="start">instant, so a switch never shows a gap, and BANDWIDTH is a measured peak, so the choice is safe.</text>

</svg>