<rect x="300" y="40" width="724" height="1250" rx="12" fill="#fcfdfe" stroke="#8a94a6" stroke-width="1.5" stroke-dasharray="7 5"/><text x="316" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#8a94a6" text-anchor="start">Video sharing platform</text>
<ellipse cx="478" cy="108" rx="152" ry="34" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.6"/><text x="478" y="113.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Register an account</text>
<ellipse cx="478" cy="188" rx="152" ry="34" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.6"/><text x="478" y="185.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Sign in with a password</text><text x="478" y="204.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1a1a1a" text-anchor="middle">or with Google</text>
<ellipse cx="478" cy="268" rx="152" ry="34" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.6"/><text x="478" y="273.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Browse the home feed</text>
<ellipse cx="478" cy="348" rx="152" ry="34" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.6"/><text x="478" y="345.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Search videos and</text><text x="478" y="364.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1a1a1a" text-anchor="middle">channels</text>
<ellipse cx="478" cy="428" rx="152" ry="34" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.6"/><text x="478" y="425.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Watch a video</text><text x="478" y="444.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1a1a1a" text-anchor="middle">with adaptive bitrate</text>
<ellipse cx="478" cy="508" rx="152" ry="34" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.6"/><text x="478" y="505.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Unlock a password-</text><text x="478" y="524.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1a1a1a" text-anchor="middle">protected video</text>
<ellipse cx="478" cy="588" rx="152" ry="34" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.6"/><text x="478" y="593.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Open a channel page</text>
<ellipse cx="478" cy="668" rx="152" ry="34" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.6"/><text x="478" y="665.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Share a link or</text><text x="478" y="684.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1a1a1a" text-anchor="middle">embed the player</text>
