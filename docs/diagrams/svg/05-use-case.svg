<text x="40" y="1416.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#5b6470" text-anchor="start">Association lines carry no arrowhead, as UML specifies. Only «include» and</text><text x="40" y="1436.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#5b6470" text-anchor="start">«trigger» relationships are directed. The transcoding use cases attach to the</text><text x="40" y="1456.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#5b6470" text-anchor="start">system actor because events start them, not a human action.</text>
