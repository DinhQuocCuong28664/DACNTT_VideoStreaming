<ellipse cx="478" cy="1068" rx="152" ry="34" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.6"/><text x="478" y="1065.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Join a channel</text><text x="478" y="1084.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1a1a1a" text-anchor="middle">membership tier</text>
<ellipse cx="478" cy="1148" rx="152" ry="34" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.6"/><text x="478" y="1145.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Keep history, watch</text><text x="478" y="1164.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1a1a1a" text-anchor="middle">later and playlists</text>
<ellipse cx="478" cy="1228" rx="152" ry="34" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.6"/><text x="478" y="1233.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Read notifications</text>
<ellipse cx="880" cy="428" rx="128" ry="34" fill="#eef7ee" stroke="#3d8b40" stroke-width="1.6"/><text x="880" y="425.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Resume and count</text><text x="880" y="444.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1a1a1a" text-anchor="middle">a view after 30 s</text>
