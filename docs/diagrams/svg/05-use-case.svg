<rect x="250" y="30" width="760" height="1325" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="630" y="60.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#111111" text-anchor="middle">Video sharing platform</text>
<ellipse cx="490" cy="118" rx="155" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="490" y="124.5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Register an account</text>
<ellipse cx="490" cy="202" rx="155" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="490" y="197.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Sign in with a password</text><text x="490" y="219.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">or with Google</text>
<ellipse cx="490" cy="286" rx="155" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="490" y="292.5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Browse the home feed</text>
<ellipse cx="490" cy="370" rx="155" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="490" y="365.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Search videos and</text><text x="490" y="387.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">channels</text>
<ellipse cx="490" cy="454" rx="155" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="490" y="449.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Watch a video</text><text x="490" y="471.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">with adaptive bitrate</text>
<ellipse cx="490" cy="538" rx="155" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="490" y="533.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Unlock a password-</text><text x="490" y="555.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">protected video</text>
<ellipse cx="490" cy="622" rx="155" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="490" y="628.5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Open a channel page</text>
<ellipse cx="490" cy="706" rx="155" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="490" y="701.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Share a link or</text><text x="490" y="723.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">embed the player</text>
<ellipse cx="490" cy="790" rx="155" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="490" y="796.5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Verify the e-mail address</text>
<ellipse cx="490" cy="874" rx="155" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="490" y="869.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Reset or change</text><text x="490" y="891.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">the password</text>
<ellipse cx="490" cy="958" rx="155" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="490" y="953.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Like, comment</text><text x="490" y="975.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">and reply</text>
<ellipse cx="490" cy="1042" rx="155" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="490" y="1048.5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Subscribe to a channel</text>
<ellipse cx="490" cy="1126" rx="155" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="490" y="1121.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Join a channel</text><text x="490" y="1143.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">membership tier</text>
<ellipse cx="490" cy="1210" rx="155" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="490" y="1205.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Keep history, watch</text><text x="490" y="1227.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">later and playlists</text>
<ellipse cx="490" cy="1294" rx="155" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="490" y="1300.5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Read notifications</text>
<ellipse cx="860" cy="454" rx="115" ry="36" fill="#6cb0ff" stroke="#4f97ec" stroke-width="1"/><text x="860" y="449.9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Resume and count</text><text x="860" y="471.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">a view after 30 s</text>
