<text x="40" y="1362.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#5b6470" text-anchor="start">Association lines carry no arrowhead, as UML specifies; only «include» is directed.</text><text x="40" y="1382.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#5b6470" text-anchor="start">A signed-in user can do everything a visitor can. Uploading and the creator studio</text><text x="40" y="1402.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#5b6470" text-anchor="start">are in Figure 3.2, moderation in Figure 3.3.</text>
