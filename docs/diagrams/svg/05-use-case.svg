<circle cx="100" cy="471" r="13" fill="#ffffff" stroke="#222222" stroke-width="1.6"/><path d="M 100 484 L 100 518" stroke="#222222" stroke-width="1.6"/><path d="M 80 496 L 120 496" stroke="#222222" stroke-width="1.6"/><path d="M 100 518 L 84 544" stroke="#222222" stroke-width="1.6"/><path d="M 100 518 L 116 544" stroke="#222222" stroke-width="1.6"/><text x="100" y="568.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Viewer</text>
<circle cx="100" cy="1017" r="13" fill="#ffffff" stroke="#222222" stroke-width="1.6"/><path d="M 100 1030 L 100 1064" stroke="#222222" stroke-width="1.6"/><path d="M 80 1042 L 120 1042" stroke="#222222" stroke-width="1.6"/><path d="M 100 1064 L 84 1090" stroke="#222222" stroke-width="1.6"/><path d="M 100 1064 L 116 1090" stroke="#222222" stroke-width="1.6"/><text x="100" y="1114.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Registered</text><text x="100" y="1135.2" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">user</text>
<circle cx="1100" cy="177" r="13" fill="#ffffff" stroke="#222222" stroke-width="1.6"/><path d="M 1100 190 L 1100 224" stroke="#222222" stroke-width="1.6"/><path d="M 1080 202 L 1120 202" stroke="#222222" stroke-width="1.6"/><path d="M 1100 224 L 1084 250" stroke="#222222" stroke-width="1.6"/><path d="M 1100 224 L 1116 250" stroke="#222222" stroke-width="1.6"/><text x="1100" y="274.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Google</text><text x="1100" y="295.2" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111111" text-anchor="middle">Identity</text>
