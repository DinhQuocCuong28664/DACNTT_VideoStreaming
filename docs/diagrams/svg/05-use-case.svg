<text x="40" y="1398.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#4b5563" text-anchor="start">An anonymous visitor and a registered user are both viewers (hollow arrow: generalisation), so both</text><text x="40" y="1421.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#4b5563" text-anchor="start">can do the use cases of the middle block. Uploading and the creator studio are in Figure 3.2,</text><text x="40" y="1444.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#4b5563" text-anchor="start">moderation in Figure 3.3.</text>

