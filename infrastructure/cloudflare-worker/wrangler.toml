name = "zelostech-api-gateway"
main = "src/index.js"
compatibility_date = "2024-10-22"
workers_dev = false

routes = [
  { pattern = "api.zelostech.site/*", zone_name = "zelostech.site" }
]

# Function URL host of dacntt-dev-backend-api (terraform output of module.lambda_backend).
# ORIGIN_VERIFY_SECRET is a Worker secret, not a var: set it from Secrets Manager with
#   aws secretsmanager get-secret-value --secret-id dacntt-dev/origin-verify-secret \
#     --query SecretString --output text | npx wrangler secret put ORIGIN_VERIFY_SECRET
[vars]
TARGET_HOST = "b7ssxm6vbhvfdcaxsdn7vmosgy0thkbw.lambda-url.ap-southeast-1.on.aws"
